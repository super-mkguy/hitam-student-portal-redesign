[theme]
base = "light"
primaryColor = "#155B37"
backgroundColor = "#F3F6F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17251C"
borderColor = "#66786A"
linkColor = "#155B37"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontWeights = [700, 700, 600, 500, 500, 500]
baseRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "2rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#155B37"
secondaryBackgroundColor = "#1D6C41"
textColor = "#FFFFFF"
codeTextColor = "#FFFFFF"
borderColor = "#2D7C4A"
primaryColor = "#A9E59A"
linkColor = "#FFFFFF"
